services:
  deepvision-studio:
    container_name: deepvision-studio
    build: .
    restart: unless-stopped
    ports:
      - "8503:8503"
    volumes:
      - ./data:/app/data
      - ./feedback:/app/feedback
      - ./models:/app/models
      - ./outputs:/app/outputs
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8503/_stcore/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
